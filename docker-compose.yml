version: "3.8"

services:
  # Serviço para a aplicação NestJS
  backend:
    image: igorgois/signature-backend:latest
    container_name: signature-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3440
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: signatures
    ports:
      - "3440:3440"
    networks:
      - app-network
    depends_on:
      - postgres
      - minio

  # Serviço PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: signature-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespw}
      POSTGRES_DB: ${DB_DATABASE:-signature_db}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Serviço MinIO (S3 Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: signature-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console Web
    volumes:
      - minio_data:/data
    networks:
      - app-network

  # Serviço para inicializar o bucket do MinIO
  createbuckets:
    image: minio/mc
    container_name: signature-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/signatures;
      /usr/bin/mc anonymous set download myminio/signatures;
      exit 0;
      "
    networks:
      - app-network

# Define as redes que os serviços usarão
networks:
  app-network:
    driver: bridge

# Define os volumes para persistência de dados
volumes:
  db_data:
  minio_data:
